<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" role="img" aria-labelledby="t d">
<title id="t">Una quota non è una profondità d’acqua</title><desc id="d">Schema illustrativo: le quote dell’acqua e di una struttura si misurano dallo stesso zero di riferimento. L’acqua che risale sulla spiaggia non forma uno strato uniforme.</desc>
<rect width="700" height="245" rx="16" fill="#f3f7f4"/>
<path d="M25 195 200 195 650 70 680 70 680 215 25 215Z" fill="#dfd5b8"/>
<path d="M25 195 200 195 650 70" fill="none" stroke="#9c8d6d" stroke-width="3"/>
<path d="M25 160Q60 135 100 157T185 153Q255 125 355 151" fill="none" stroke="#267f99" stroke-width="4"/>
<path d="M355 151H660" stroke="#267f99" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M25 195H680" stroke="#677b75" stroke-width="2" stroke-dasharray="5 6"/>
<g stroke="#284e4c" stroke-width="3" fill="#f5f1df"><path d="M515 88 531 64H599L615 88Z"/><path d="M526 88V113H603V88M526 101H603M545 102V113M586 102V113"/></g>
<path d="M401 153V193M395 159 401 153 407 159M395 187 401 193 407 187" fill="none" stroke="#267f99" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#173f40"><text x="25" y="32" font-size="23" font-weight="bold">Confrontiamo quote misurate dallo stesso zero</text><text x="445" y="137" font-size="18">Quota dell’acqua</text><text x="444" y="54" font-size="18">Quota della struttura</text><text x="26" y="235" font-size="17">Zero di riferimento</text><text x="26" y="106" font-size="17" fill="#267f99">Risalita intermittente delle onde</text></g>
</svg>
