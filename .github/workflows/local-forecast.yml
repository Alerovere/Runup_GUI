name: Previsioni locali

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Origine dei dati (demo = onde sintetiche)
        type: choice
        options: [meteocean, copernicus, demo]
        default: meteocean
  schedule:
    # UTC: MeteOcean publishes at 06:20; allow 20 minutes before acquisition.
    - cron: '40 6 * * *'

permissions:
  contents: read

concurrency:
  group: local-forecast-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.FORECAST_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: forecast_service/requirements.txt
      - name: Installa il motore di calcolo
        run: python -m pip install -r forecast_service/requirements.txt
      - name: Verifica calcoli e configurazione
        run: python -B -m unittest discover -s tests/forecast -v
      - name: Verifica l’interfaccia
        run: node --test tests/forecast/*.cjs
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp forecast_site/index.html forecast_site/metodo.html forecast_site/disclaimer.html forecast_site/styles.css forecast_site/app.js forecast_site/reader.js forecast_site/beach-profile.js forecast_site/icon.svg _site/
          cp -R forecast_site/assets _site/
          touch _site/.nojekyll
      - name: Genera il bollettino dimostrativo
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'demo'
        run: python -B scripts/update_forecasts.py --demo --output _site/data
      - name: Scarica i dati e calcola le previsioni
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'demo'
        env:
          FORECAST_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.FORECAST_PROVIDER || 'meteocean' }}
          COPERNICUSMARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if python -B scripts/update_forecasts.py --provider "$FORECAST_PROVIDER" --output _site/data; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo 'Aggiornamento fallito: il sito già pubblicato rimane invariato.'
          exit 1
      - name: Conserva i GeoJSON e KMZ di questa elaborazione
        uses: actions/upload-artifact@v4
        with:
          name: inondazione-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _site/data/maps/**/*.geojson
            _site/data/maps/**/*.kmz
          if-no-files-found: ignore
          retention-days: 90
      - name: Prepara le infografiche per Telegram
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-borghetto-bulletin
          path: |
            _site/data/forecast.json
            _site/data/social/borghetto-santo-spirito--*.png
          if-no-files-found: error
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il portale
        id: deployment
        uses: actions/deploy-pages@v4


  telegram:
    name: Bollettino Telegram Borghetto
    needs: deploy
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.TELEGRAM_ENABLED != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'demo')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verifica la configurazione Telegram
        id: credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Telegram non configurato: il portale è pubblicato, nessun messaggio inviato.'
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Recupera il bollettino appena pubblicato
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: telegram-borghetto-bulletin
          path: telegram-bulletin
      - name: Invia il bollettino giornaliero di Borghetto
        id: send
        if: steps.credentials.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/send_telegram_bulletin.py --data telegram-bulletin --state telegram-state/receipt.json --send
      - name: Conserva il registro degli invii Telegram
        if: always() && steps.credentials.outputs.enabled == 'true' && hashFiles('telegram-state/receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: telegram-borghetto-state-v1
          path: telegram-state/receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
